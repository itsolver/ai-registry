name: Refresh Production Catalog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-catalog.yml"
      - "package-lock.json"
      - "package.json"
      - "scripts/refresh-catalog-from-kv.ts"
      - "src/**"
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and store complete catalog
        run: npm run refresh:catalog:kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
